name: CI

# Every check here takes seconds, so a pull request, a push to master and the daily release run the same
# steps. A push to master only checks; it never publishes. The release workflow (release.yml) calls this
# file through workflow_call on master's commit before it publishes, and only on a day with a change to
# release.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call: {}

# The workflow's token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          # no cache — standalone package, fast install

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Registry checks
        run: node --test test/registry.test.mjs

      - name: Skill content checks
        run: node --test test/skill-content.test.mjs

      - name: Release rules
        run: node --test test/release-rules.test.mjs

      - name: Release gate
        run: node --test test/release-gate.test.mjs
